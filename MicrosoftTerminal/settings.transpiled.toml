'$help' = 'https://aka.ms/terminal-documentation'
'$schema' = 'https://aka.ms/terminal-profiles-schema'
alwaysShowTabs = false
defaultProfile = '{574e775e-4f2a-5b96-ac1e-a2962a402336}'
showTabsInTitlebar = false
themes = []
'warning.confirmCloseAllTabs' = false

[[actions]]
command = 'tabSearch'
id = 'User.tabSearch'

[[keybindings]]
id = 'Terminal.ClosePane'
keys = 'ctrl+shift+w'

[[keybindings]]
id = 'Terminal.MoveFocusLeft'
keys = 'ctrl+h'

[[keybindings]]
id = 'Terminal.MoveFocusDown'
keys = 'ctrl+j'

[[keybindings]]
id = 'Terminal.MoveFocusUp'
keys = 'ctrl+k'

[[keybindings]]
id = 'Terminal.MoveFocusRight'
keys = 'ctrl+l'

[[keybindings]]
id = 'Terminal.OpenNewTabDropdown'
keys = 'ctrl+shift+n'

[[keybindings]]
id = 'Terminal.SplitPaneDown'
keys = 'ctrl+shift+minus'

[[keybindings]]
id = 'Terminal.PrevTab'
keys = 'ctrl+shift+tab'

[[keybindings]]
id = 'Terminal.NextTab'
keys = 'ctrl+tab'

[[keybindings]]
id = 'User.tabSearch'
keys = 'ctrl+shift+t'

[[keybindings]]
id = 'Terminal.SwapPaneUp'
keys = 'alt+shift+k'

[[keybindings]]
id = 'Terminal.ToggleCommandPalette'
keys = 'alt+x'

[[keybindings]]
id = 'Terminal.TogglePaneZoom'
keys = 'ctrl+shift+z'

[[keybindings]]
id = 'Terminal.SwapPaneLeft'
keys = 'alt+shift+h'

[[keybindings]]
id = 'Terminal.SwapPaneDown'
keys = 'alt+shift+j'

[[keybindings]]
id = 'Terminal.SwapPaneRight'
keys = 'alt+shift+l'

