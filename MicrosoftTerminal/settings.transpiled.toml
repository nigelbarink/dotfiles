[profiles]
[profiles.defaults]
colorScheme = 'Catppuccin Mocha'
cursorColor = '#F5E0E6'
cursorShape = 'bar'
opacity = 90
padding = '8'
tabColor = '#1E1E2E'
useAcrylic = true

[profiles.defaults.font]
face = 'RobotoMono Nerd Font'
size = 10
weight = 'bold'

[[profiles.list]]
commandline = 'powershell.exe -NoLogo'
guid = '{61c54bbd-c2c6-5271-96e7-009a87ff44bf}'
hidden = false
name = 'PowerShell'
startingDirectory = '%USERPROFILE%'

[[profiles.list]]
commandline = 'pwsh.exe -NoLogo'
guid = '{574e775e-4f2a-5b96-ac1e-a2962a402336}'
hidden = false
name = 'PowerShell 7'
source = 'Windows.Terminal.PowershellCore'
startingDirectory = '%USERPROFILE%'

[[profiles.list]]
commandline = "pwsh.exe -NoLogo -NoExit -Command \"Import-Module \\\"${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\18\\BuildTools\\Common7\\Tools\\Microsoft.VisualStudio.DevShell.dll\\\"; Enter-VsDevShell 6c43edf9; $host.UI.RawUI.WindowTitle = 'Developer PowerShell'\""
guid = '{9f2d0e2e-4ed0-4aa3-a1a7-000000000001}'
hidden = false
name = 'Developer PowerShell'
startingDirectory = '%WEZTERM_GIT_ROOT%'

[[profiles.list]]
commandline = 'pwsh.exe -NoLogo -NoExit -Command "& \"$env:USERPROFILE\miniconda3\shell\condabin\conda-hook.ps1\"; conda activate base"'
guid = '{9f2d0e2e-4ed0-4aa3-a1a7-000000000002}'
hidden = false
name = 'Conda PowerShell'
startingDirectory = '%WEZTERM_GIT_ROOT%\Machine Learning'

[[profiles.list]]
commandline = 'cmd.exe /k D:\VisualStudio2022\VC\Auxiliary\Build\vcvars64.bat'
guid = '{9f2d0e2e-4ed0-4aa3-a1a7-000000000003}'
hidden = false
name = 'X64 Native Tools VS 2022 - D'
startingDirectory = '%USERPROFILE%'

[[profiles.list]]
commandline = 'cmd.exe /k C:\VisualStudio2022\VC\Auxiliary\Build\vcvars64.bat'
guid = '{9f2d0e2e-4ed0-4aa3-a1a7-000000000004}'
hidden = false
name = 'X64 Native Tools VS 2022 - C'
startingDirectory = '%USERPROFILE%'

